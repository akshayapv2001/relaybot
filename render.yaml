# Render Blueprint: New > Blueprint > pick this repo. Secrets marked sync:false are
# entered in the Render dashboard, never committed.
services:
  - type: web
    name: relaybot
    runtime: docker
    plan: free
    region: oregon          # keep Render and Neon in the same region (Neon: AWS us-west-2)
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PUBLIC_BASE_URL          # e.g. https://relaybot.onrender.com (no trailing slash)
        sync: false
      - key: DATABASE_URL             # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENCRYPTION_KEY       # openssl rand -base64 32
        sync: false
      - key: GROQ_API_KEY             # optional; AI triage is skipped without it
        sync: false
