server:
  port: ${PORT:8080}
  # Render terminates TLS; trust X-Forwarded-* so redirects and client IPs are correct.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: relaybot
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0          # let Neon scale to zero when idle
      connection-timeout: 5000
      idle-timeout: 60000
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true

relaybot:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  discord:
    application-id: ${DISCORD_APPLICATION_ID}
    public-key: ${DISCORD_PUBLIC_KEY}
    bot-token: ${DISCORD_BOT_TOKEN}
    client-secret: ${DISCORD_CLIENT_SECRET}
    register-commands: ${DISCORD_REGISTER_COMMANDS:true}
    api-base: https://discord.com/api/v10
    max-timestamp-skew-seconds: 300
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.1-8b-instant}
    base-url: https://api.groq.com/openai/v1
  security:
    encryption-key: ${APP_ENCRYPTION_KEY}
  jobs:
    poll-interval-ms: 1000
    batch-size: 5
    stuck-after-seconds: 120
    safety-sweep-minutes: 60

logging:
  level:
    root: INFO
    dev.relaybot: INFO
